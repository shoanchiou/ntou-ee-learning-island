function showSources(){openDialog('SOURCES & RULES',`<h2>這趟航程的資料來源</h2><p>以三份 Word 製作課程探索，參考 <a href="https://puma.taipei/heart-island" target="_blank" rel="noopener">HEART 政策島</a>的探索概念。插圖為原創，系主任為虛構導覽角色。</p>${sources.map((s,i)=>`<div class="source-entry"><small>SOURCE 0${i+1}</small><h3>${esc(s.title)}</h3><p>${s.filename}<br>${i===0?'用於年級與學期配置。原圖寫六選四，本作品核心規則採下方 B 圖的六選三。':i===1?'六門核心：自動控制、通訊工程、半導體物理、資料結構、複變函數、電機機械，六選三。':'此份為輔系資料，不是主修完整必修表。原表至少25學分，但八筆必修合計24，保留原始差異。'}</p><a href="${embeddedDocuments[s.filename]}" download="${esc(s.filename)}">下載原始 DOCX ↓</a></div>`).join('')}<div class="source-entry"><h3>學習探索與修課規定</h3><p>兩份關聯圖未標入學年度；A 圖用於年級位置，B 圖用於核心六選三。半導體物理的年級與學期未由 B 圖指定。領域卡片為相關課程導覽，並非官方先修鏈。各領域可有交集，課程分組不構成獨占歸屬。</p><p>依本次需求，加深加廣先呈現領域，略過額外科目選擇；選擇領域只記錄探索興趣，不宣稱已完成正式加深加廣或畢業要求。</p><p>一般性課程簡介供初步認識；實際課綱、修課與畢業規定請依入學年度公告。官網：<a href="https://ee.ntou.edu.tw/p/412-1062-7484.php?Lang=zh-tw" target="_blank" rel="noopener">課程規劃</a> · <a href="https://ee.ntou.edu.tw/p/412-1062-7483.php?Lang=zh-tw" target="_blank" rel="noopener">修業規定</a></p></div>`);}
$('#source-open').onclick=showSources;$('#brand-home').onclick=e=>{e.preventDefault();go(1);};
function progress(){$('#journey-progress').innerHTML=labels.map((n,i)=>`<li class="step ${step===i+1?'current':i+1<step?'done':i+1>furthest?'locked':''}"><button data-step="${i+1}" ${i+1>furthest?'disabled':''} ${step===i+1?'aria-current="step"':''}><span class="step-number">${i+1<step?'✓':String(i+1).padStart(2,'0')}</span><span class="step-title">${n}</span></button></li>`).join('');$$('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));}
function go(n){if(n>=4&&selected.size!==3){toast('先完成三門核心的選擇。');return;}if(n===5&&!focus){toast('先選擇一個想深入了解的領域。');return;}step=n;furthest=Math.max(furthest,n);semester=1;render();window.scrollTo({top:0,behavior:'instant'});$('#journey').focus({preventScroll:true});}
function avatar(){return '<span class="director-face" aria-hidden="true"><i></i><b>▭</b></span>';}
function actions(prev,next,label,disabled=false){return `<div class="step-actions">${prev?`<button class="secondary-btn" id="step-prev">← 上一站</button>`:'<span class="start-hint">從這裡開始 →</span>'}<button class="primary-btn" id="step-next" ${disabled?'disabled':''}>${label}<span>→</span></button></div>`;}
function bindActions(prev,next){if(prev)$('#step-prev').onclick=()=>go(prev);$('#step-next').onclick=()=>go(next);}
function courseDescription(name){return info[name]?.[1]||fields.find(f=>f.core===name)?.description.split('以下')[0]||'將電機基礎連到新的學習方向。';}
function showCourse(name){openDialog('COURSE PREVIEW',`<div class="dialog-course-icon">${info[name]?.[0]||fields.find(f=>f.core===name)?.symbol||'◇'}</div><h2>${name}</h2><p>${courseDescription(name)}</p><p class="dialog-note">一般性學習導讀，實際內容依開課大綱。${coreOptions.includes(name)?'這門課是六選三的核心選項。':''}</p><button class="primary-btn" id="course-back">繼續探索 →</button>`);$('#course-back').onclick=()=>$('#source-dialog').close();}

function showGuide(year){openDialog('DIRECTOR’S GUIDE',`${avatar()}<h2>大${year===1?'一':'二'}，從這裡開始。</h2><p>${year===1?'先準備數學、物理與程式的基礎。點選課程卡片，看看這門課在學什麼；看完上下學期，就能前往大二。':'電路、電子、電磁與訊號逐漸連起來。下一站會展開六個領域，你可以先看各組的課程，再選擇三門核心。'}</p><button class="primary-btn" id="guide-back">我知道下一步了 →</button>`);$('#guide-back').onclick=()=>$('#source-dialog').close();}
function summary(){return `<div class="selection-summary">${Array.from({length:3},(_,i)=>`<span class="selection-slot ${[...selected][i]?'filled':''}"><i>${[...selected][i]?'✓':String(i+1).padStart(2,'0')}</i><span>${[...selected][i]||'選一門核心'}</span></span>`).join('')}<b class="selection-tally">${selected.size}<small> / 3</small></b></div>`;}
function renderCore(){$('#journey').innerHTML=`<section class="selection-screen screen-enter"><div class="selection-header"><div><p class="chapter-eyebrow">CHAPTER 03 / 05 · 大二下 → 大三</p><h1>六個方向，選三個起點。</h1><p class="visual-instruction"><b>1</b> 展開領域 <span>→</span> <b>2</b> 看看科目 <span>→</span> <b>3</b> 選三門核心</p></div><span class="selection-badge">核心必選<br><strong>6 選 3</strong></span></div>${summary()}<div class="field-grid">${fields.map((f,i)=>`<article class="field-card ${expanded===f.id?'expanded':''} ${selected.has(f.core)?'picked':''}"><button class="field-toggle" data-expand="${f.id}" aria-expanded="${expanded===f.id}" aria-controls="expand-${f.id}"><span class="field-index">0${i+1}</span><span class="field-symbol">${f.symbol}</span><span class="field-name">${f.name}</span><span class="field-hint">${selected.has(f.core)?'已選：'+f.core:'展開看科目'}</span><span class="chevron">${expanded===f.id?'−':'＋'}</span></button><div class="field-expand" id="expand-${f.id}" ${expanded===f.id?'':'hidden'}><p class="field-intro">${f.description.split('以下')[0]}</p><div class="core-course"><div class="course-details"><small>核心入口</small><strong>${f.core}</strong></div><button class="core-select ${selected.has(f.core)?'selected':''}" data-core="${f.core}" aria-pressed="${selected.has(f.core)}">${selected.has(f.core)?'✓ 已選':'＋ 選這門'}</button></div><p class="related-label">這個領域也會接觸</p><div class="related-courses">${f.courses.filter(n=>n!==f.core).map(n=>`<button data-course="${n}">${n} ↗</button>`).join('')}</div></div></article>`).join('')}</div><p class="selection-note">六門核心依關聯圖 B；領域分組為探索導覽，不是正式先修限制。領域之間的課程可能重疊。</p><div class="selection-footer"><div class="selection-status"><span class="status-ring">${selected.size}/3</span><span>${selected.size===3?'三個起點選好了。':'展開卡片，選三門你想學的核心。'}<small>${selected.size===3?'下一站：認識想深入了解的領域。':`還可以選 ${3-selected.size} 門`}</small></span></div>${actions(2,4,'繼續探索領域',selected.size!==3)}</div></section>`;
$$('[data-expand]').forEach(b=>b.onclick=()=>{expanded=expanded===b.dataset.expand?null:b.dataset.expand;renderCore();});$$('[data-core]').forEach(b=>b.onclick=()=>{const name=b.dataset.core;if(selected.has(name)){selected.delete(name);if(fields.find(f=>f.core===name)?.id===focus)focus=null;}else if(selected.size<3)selected.add(name);else{toast('已選三門，先取消一門就能換選。');return;}renderCore();});$$('[data-course]').forEach(b=>b.onclick=()=>showCourse(b.dataset.course));bindActions(2,4);}
function renderFocus(){const choices=fields.filter(f=>selected.has(f.core));if(!choices.some(f=>f.id===focus))focus=null;const active=choices.find(f=>f.id===focus);$('#journey').innerHTML=`<section class="selection-screen screen-enter"><div class="selection-header"><div><p class="chapter-eyebrow">CHAPTER 04 / 05 · 大三 → 大四</p><h1>哪個領域，讓你想多走一步？</h1><p>從已選的三個起點，點一個你想深入了解的方向。</p></div><span class="selection-badge">領域探索<br><strong>3 → 1</strong></span></div><div class="focus-choices">${choices.map(f=>`<button class="focus-choice ${focus===f.id?'active':''}" data-focus="${f.id}" aria-pressed="${focus===f.id}"><span class="field-symbol">${f.symbol}</span><strong>${f.name}</strong><small>從 ${f.core} 出發</small><i>${focus===f.id?'✓':'○'}</i></button>`).join('')}</div>${active?`<div class="focus-detail"><span class="focus-large-symbol">${active.symbol}</span><div><p class="chapter-eyebrow">你的探索方向</p><h2>${active.name}</h2><p>${active.description.split('以下')[0]}</p><div class="related-courses">${active.courses.map(n=>`<button data-course="${n}">${n} ↗</button>`).join('')}</div></div></div>`:'<div class="focus-placeholder"><span>↖ ↑ ↗</span><h2>點選上方的一個領域。</h2><p>你的探索方向，會在這裡展開。</p></div>'}<p class="selection-note">此步只記錄想深入了解的領域，先略過加深加廣的額外科目；不代表已完成正式修課要求。</p><div class="selection-footer"><div class="selection-status"><span class="status-ring">${active?'✓':'○'}</span><span>${active?active.name:'選一個你想多了解的方向'}<small>最後一頁，才會整理出你的完整結果。</small></span></div>${actions(3,5,'產生我的航線',!active)}</div></section>`;$$('[data-focus]').forEach(b=>b.onclick=()=>{focus=b.dataset.focus;renderFocus();});$$('[data-course]').forEach(b=>b.onclick=()=>showCourse(b.dataset.course));bindActions(3,5);}
function renderResult(){const f=fields.find(f=>f.id===focus),picked=fields.filter(f=>selected.has(f.core));$('#journey').innerHTML=`<section class="result-screen screen-enter"><div class="result-heading"><p class="chapter-eyebrow">CHAPTER 05 / 05 · YOUR LEARNING ROUTE</p><h1>你的電機航線，準備啟航。</h1><p>從大一的第一步，到現在想深入的方向。</p></div><div class="result-layout"><div class="result-main"><div class="result-banner"><span class="result-icon">${f.symbol}</span><div>我的探索方向<br><strong>${f.name}</strong></div></div><div class="result-path"><div class="path-stop"><span class="year-label">01 / 大一</span><h3>建立共同語言</h3><div class="path-courses">數學 · 物理 · 程式基礎</div></div><div class="path-stop"><span class="year-label">02 / 大二</span><h3>讓知識彼此相連</h3><div class="path-courses">電路 · 電子 · 電磁 · 訊號</div></div><div class="path-stop"><span class="year-label">03 / 大二下 → 大三</span><h3>六選三，找到三個起點</h3><div class="path-courses">${picked.map(f=>`<span class="chosen">${f.core}</span>`).join('')}</div></div><div class="path-stop"><span class="year-label">04 / 大三 → 大四</span><h3>繼續探索 ${f.name}</h3><div class="path-courses">${f.courses.map(n=>`<span>${n}</span>`).join('')}</div><p class="path-note">相關課程線索，非額外必修清單。</p></div></div></div><aside class="result-side"><div class="result-card"><p class="result-label">MY CORE COURSES / 三門核心</p>${picked.map(f=>`<div class="result-item"><span>${f.core}<small>${f.name}</small></span><span class="result-tag">已選</span></div>`).join('')}</div><div class="result-card"><p class="result-label">MY DIRECTION / 想深入的領域</p><div class="result-item"><strong>${f.name}</strong><span>${f.symbol}</span></div></div><button class="download-result" id="download-result">下載我的學習航線 ↓</button><button class="restart-btn" id="adjust-result">← 調整我的選擇</button><p class="result-note">此結果為學習探索規劃；加深加廣的額外科目暫未選擇。實際修課與畢業條件依入學年度及系辦公告。</p></aside></div><div class="result-end"><button class="secondary-btn" id="restart">回到大一，再走一遍 ↺</button><span>保持好奇，下一站由你決定。</span></div></section>`;$('#download-result').onclick=exportResult;$('#adjust-result').onclick=()=>go(3);$('#restart').onclick=()=>go(1);}
function exportResult(){const f=fields.find(f=>f.id===focus);const text=`海大電機｜我的學習探索航線\r\n\r\n大一：數學、物理、程式基礎\r\n大二：電路、電子、電磁、訊號\r\n\r\n六選三核心\r\n${[...selected].map(n=>'✓ '+n).join('\r\n')}\r\n\r\n想深入了解的領域：${f.name}\r\n相關課程線索：${f.courses.join('、')}\r\n\r\n加深加廣的額外科目先略過；本頁不宣稱已完成正式加深加廣或畢業要求。\r\n來源：251346124.docx、544372502 (1).docx、828533401.docx\r\n年級依關聯圖A，核心六選三依關聯圖B。\r\n實際課程與修業規定請依入學年度及系辦公告。`;const blob=new Blob(['\ufeff',text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='我的電機學習航線.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('你的學習航線已下載。');}
function render(){progress();if(step<3)renderYear();else if(step===3)renderCore();else if(step===4)renderFocus();else renderResult();}
render();
})();
